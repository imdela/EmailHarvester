        counter_step: 50
      - name: "Instagram [Google]"
        url: 'https://www.google.com/search?num=100&start={counter}&hl=en&q=site%3Ainstagram.com+"%40{word}"'
        counter_init: 0
        counter_step: 100
  linkedin:
    sources:
      - name: "LinkedIn [Bing]"
        url: "http://www.bing.com/search?q=site%3Alinkedin.com/in/+%40{word}&count=50&first={counter}"
        counter_init: 0
        counter_step: 50
      - name: "LinkedIn [Google]"
        url: 'https://www.google.com/search?num=100&start={counter}&hl=en&q=site%3Alinkedin.com+"%40{word}"'
        counter_init: 0
        counter_step: 100
  reddit:
    sources:
      - name: "Reddit [Bing]"
        url: "http://www.bing.com/search?q=site%3Areddit.com+%40{word}&count=50&first={counter}"
        counter_init: 0
