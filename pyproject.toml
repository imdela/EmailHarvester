[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"] # standard flake8 basics + bugbear + isort
ignore = ["E501"] # ignore line too long since we use auto-format but keep legacy loops intact

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true # for external un-typed packages like requests
