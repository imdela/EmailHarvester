services:
  tor:
    image: dockage/tor-privoxy:latest
    container_name: tor-proxy
    environment:
      - TOR_CONTROL_PASSWORD=emailharvester_secret
      - TOR_CONTROL_PORT=9051
    ports:
      - "9050:9050"
      - "9051:9051"
      - "8118:8118"
    tmpfs:
      - /run
      - /run/lock
      - /sys/fs/cgroup
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - harvester_net

  emailharvester:
    build: .
    container_name: email-harvester
    environment:
      - EH_TOR_HOST=tor
      - EH_TOR_PORT=9050
      - EH_TOR_CONTROL_PORT=9051
      - EH_TOR_CONTROL_PASSWORD=emailharvester_secret
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - harvester_net
    entrypoint: ["python3", "-m", "src.cli"]
    # Provide default arguments so the container does not exit rapidly, 
    # but normally users will override the command via docker-compose run.
    command: ["-h"]

networks:
  harvester_net:
    driver: bridge
